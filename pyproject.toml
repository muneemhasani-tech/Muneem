[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lead-verifier"
version = "0.1.0"
description = "Filter raw real-estate leads (phone, email, domain) into a graded CSV before CRM import."
requires-python = ">=3.11"
dependencies = [
  "phonenumbers>=8.13",
  "dnspython>=2.4",
  "disposable-email-domains>=0.0.100",
  "httpx>=0.25",
  "tldextract>=5.0",
  "whoisit>=3.0",
  "python-whois>=0.9",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "typer>=0.12",
  "tzdata",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21"]

[project.scripts]
lead-verifier = "lead_verifier.cli:app"

[tool.setuptools.packages.find]
include = ["lead_verifier*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
